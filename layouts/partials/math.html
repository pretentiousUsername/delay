<script type="text/javascript">
    MathJax = {
        output: {
            font: "mathjax-stix2",
            displayAlign: "left",
        },
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        tex: {
            macros: {
                RR: "\\mathbb{R}",
                dl: ["\, d^{#1} #2", 2, ''],
                diff: ["\\frac{d^{#1} #2}{d #3^#1}", 3, "{}"],
                diffp: ["\\frac{\\partial{#1} #2}{\\partial #3^#1}", 3, "{}"],
                abs: ["\\left| #1 \\right|", 1],
                expval: ["\\left< #1 \\right>", 1],
                comm: ["{\\left[ #1 , #2 \\right]}", 2],   // commutator
                acomm: ["\\left\\{ #1, #2 \\right\\}", 2], // anticommutator
                bra: ["\\left< #1 \\right|", 1],
                ket: ["\\left| #1 \\right>", 1],
                innerprod: ["\\left< #1 \\right| \\left.\\! #2 \\right>", 2],
            }
        }
    };
</script>

<!--
THIS FIXES THE INLINE MATH BULLSHIT!

Thank you, Misha Brukman!

https://misha.brukman.net/blog/2022/04/writing-math-with-hugo/
-->

<script type="text/x-mathjax-config">
  MathJax.Hub.Queue(function() {
    // Fix <code> tags after MathJax finishes running. This is a
    // hack to overcome a shortcoming of Markdown. Discussion at
    // https://github.com/mojombo/jekyll/issues/199
    var all = MathJax.Hub.getAllJax(), i;
    for(i = 0; i < all.length; i += 1) {
        all[i].SourceElement().parentNode.className += ' has-jax';
    }
});
</script>
